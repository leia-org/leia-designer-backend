type: object
required:
  - apiVersion
  - metadata
  - spec
properties:
  apiVersion:
    type: string
    description: The API version of the Problem
  metadata:
    type: object
    required:
      - name
      - version
    properties:
      name:
        type: string
      version:
        type: string
  spec:
    type: object
    properties:
      description:
        type: string
      personaBackground:
        type: string
      details:
        type: string
      solution:
        type: string
      solutionFormat:
        type: string
        enum:
          $ref: '../../../enums/v1/solutionFormat.yaml'
      process:
        type: array
        items:
          type: string
          enum:
            $ref: '../../../enums/v1/process.yaml'
      extends:
        type: object
      overrides:
        type: object
      constrainedTo:
        type: object
      widgets:
        type: array
        description: >-
          Activity widgets the workbench mounts for this problem. Tool schemas
          are not authored here; tools are referenced by name with per-activity
          usage guidance.
        items:
          type: object
          properties:
            widgetType:
              type: string
            slot:
              type: string
              enum: [left, right, main]
            params:
              type: object
            tools:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  enabled:
                    type: boolean
                  usage:
                    type: string
