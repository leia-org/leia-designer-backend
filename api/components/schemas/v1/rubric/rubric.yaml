type: object
additionalProperties: false
required:
  - _id
  - apiVersion
  - metadata
  - spec
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
  apiVersion:
    type: string
    enum: [v1]
  metadata:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 120
  spec:
    $ref: './rubricSpec.yaml'
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
