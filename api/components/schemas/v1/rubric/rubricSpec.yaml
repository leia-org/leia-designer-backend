type: object
additionalProperties: false
required: [sections]
properties:
  sections:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [title, weight, levels, criteria]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        weight:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
        levels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500
        criteria:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, descriptors]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 1000
              descriptors:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [level, description]
                  properties:
                    level:
                      type: string
                      minLength: 1
                      maxLength: 500
                    description:
                      type: string
                      minLength: 1
                      maxLength: 10000
