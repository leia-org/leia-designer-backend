type: object
required:
  - name
  - markdown
properties:
  name:
    type: string
    minLength: 1
    maxLength: 120
    example: Oral presentation
  description:
    type: string
    maxLength: 500
    example: Criteria for the final project presentation.
  markdown:
    type: string
    maxLength: 50000
    description: One or more Markdown tables, optionally grouped under headings whose trailing [n%] sets the section weight.
    example: "## Content [60%]\n| Criterion | Emerging | Proficient |\n| --- | --- | --- |\n| Accuracy | Some errors | Correct |\n\n## Presentation [40%]\n| Criterion | Emerging | Proficient |\n| --- | --- | --- |\n| Clarity | Unclear | Clear and concise |"
