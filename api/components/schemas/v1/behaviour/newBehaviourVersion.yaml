type: object
required:
  - apiVersion
  - metadata
  - spec
properties:
  apiVersion:
    type: string
    description: The API version of the Behaviour
  metadata:
    type: object
    required:
      - name
      - version
    properties:
      name:
        type: string
      version:
        type: string
  spec:
    type: object
    properties:
      conversationDynamics:
        type: object
        properties:
          stoppingCondition:
            type: object
            properties:
              enabled:
                type: boolean
              prompt:
                type: string
                description: Required when enabled is true.
          speaksFirst:
            type: object
            properties:
              enabled:
                type: boolean
              prompt:
                type: string
                description: Optional guidance for LEIA's first message.
      description:
        type: string
      role:
        type: string
      process:
        type: array
        items:
          type: string
        enum:
          $ref: '../../../enums/v1/process.yaml'
