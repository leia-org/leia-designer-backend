type: object
required:
  - apiVersion
  - metadata
  - spec
properties:
  apiVersion:
    type: string
    description: The API version of the Behaviour
  metadata:
    type: object
    required:
      - name
      - version
    properties:
      name:
        type: string
      version:
        type: string
  spec:
    type: object
    properties:
      reflective:
        type: boolean
        default: false
        description: Enables a reflective interview following a normal LEIA.
      evaluationPrompt:
        type: string
        description: Required and non-empty when reflective is true. Instructor's evaluation objective (not the problem's automatic grading prompt).
      stoppingPrompt:
        type: string
        description: Required and non-empty when reflective is true. Instructions for concluding the interview.
      description:
        type: string
      role:
        type: string
      process:
        type: array
        items:
          type: string
        enum:
          $ref: '../../../enums/v1/process.yaml'
