type: object
required:
  - leia
properties:
  stageId:
    type: string
    format: uuid
    description: Stage membership. When adding a LEIA to a staged activity, it may be omitted if the activity has one stage.
  leia:
    type: string
    description: Unique identifier for the Leia
  configuration:
    type: object
    properties:
      mode:
        type: string
        description: The mode of the Leia
        enum:
          $ref: '../../../enums/v1/mode.yaml'
      data:
        type: object
        description: Aditional data such as the transcription to be displayed, the form...
