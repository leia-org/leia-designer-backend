type: object
required:
  - stages
properties:
  name:
    type: string
  leias:
    type: array
    items:
      $ref: './leiaConfig.yaml'
  stages:
    type: array
    minItems: 1
    description: Ordered stages.
    items:
      $ref: './stage.yaml'
  user:
    type: string
    description: Unique identifier for the user who created the experiment
  createdAt:
    type: string
    format: date-time
    description: Date and time when the experiment was created
  updatedAt:
    type: string
    format: date-time
    description: Date and time when the experiment was last updated
