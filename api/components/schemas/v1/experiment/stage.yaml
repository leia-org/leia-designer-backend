type: object
additionalProperties: false
required: [id, orchestration]
properties:
  id:
    type: string
    format: uuid
  outputSources:
    type: object
    properties:
      conversation:
        type: string
        format: uuid
        nullable: true
      submitedSolution:
        type: string
        format: uuid
        nullable: true
  orchestration:
    $ref: './orchestration.yaml'
