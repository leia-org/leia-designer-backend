openapi: 3.0.3
info:
  title: LEIA Designer API
  version: '1.0.0'
  description: LEIA Designer API documentation
servers:
  - url: /api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

security:
  - bearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Personas v1
    description: Main Persona API and v1 endpoints
  - name: Behaviours v1
    description: Main Behaviour API and v1 endpoints
  - name: Problems v1
    description: Main Problem API and v1 endpoints
  - name: Leias v1
    description: Main Leia API and v1 endpoints
  - name: Experiments v1
    description: Main Experiment API and v1 endpoints
  - name : Labels v1
    description: Main Label API and v1 endpoints
  - name: Rubrics v1
    description: Instructor-owned evaluation rubrics
  - name: Runner v1
    description: Main Runner API and v1 endpoints
  - name: Provider v1
    description: Main Provider API and v1 endpoints
paths:
  # Persona v1 paths
  /v1/personas:
    $ref: './paths/v1/personas/index.yaml'
  /v1/personas/version:
    $ref: './paths/v1/personas/version.yaml'
  /v1/personas/exists/{name}:
    $ref: './paths/v1/personas/exists-_name.yaml'
  /v1/personas/name/{name}:
    $ref: './paths/v1/personas/name-_name.yaml'
  /v1/personas/name/{name}/version/{version}:
    $ref: './paths/v1/personas/name-_name-version-_version.yaml'
  /v1/personas/{id}:
    $ref: './paths/v1/personas/_id.yaml'

  # Problem v1 paths
  /v1/problems:
    $ref: './paths/v1/problems/index.yaml'
  /v1/problems/version:
    $ref: './paths/v1/problems/version.yaml'
  /v1/problems/exists/{name}:
    $ref: './paths/v1/problems/exists-_name.yaml'
  /v1/problems/name/{name}:
    $ref: './paths/v1/problems/name-_name.yaml'
  /v1/problems/name/{name}/version/{version}:
    $ref: './paths/v1/problems/name-_name-version-_version.yaml'
  /v1/problems/{id}:
    $ref: './paths/v1/problems/_id.yaml'

  # Behaviour v1 paths
  /v1/behaviours:
    $ref: './paths/v1/behaviours/index.yaml'
  /v1/behaviours/version:
    $ref: './paths/v1/behaviours/version.yaml'
  /v1/behaviours/exists/{name}:
    $ref: './paths/v1/behaviours/exists-_name.yaml'
  /v1/behaviours/name/{name}:
    $ref: './paths/v1/behaviours/name-_name.yaml'
  /v1/behaviours/name/{name}/version/{version}:
    $ref: './paths/v1/behaviours/name-_name-version-_version.yaml'
  /v1/behaviours/{id}:
    $ref: './paths/v1/behaviours/_id.yaml'

  # Leia v1 paths
  /v1/leias:
    $ref: './paths/v1/leias/index.yaml'
  /v1/leias/version:
    $ref: './paths/v1/leias/version.yaml'
  /v1/leias/exists/{name}:
    $ref: './paths/v1/leias/exists-_name.yaml'
  /v1/leias/name/{name}:
    $ref: './paths/v1/leias/name-_name.yaml'
  /v1/leias/name/{name}/version/{version}:
    $ref: './paths/v1/leias/name-_name-version-_version.yaml'
  /v1/leias/{id}:
    $ref: './paths/v1/leias/_id.yaml'


  # Experiment v1 paths
  /v1/experiments:
    $ref: './paths/v1/experiments/index.yaml'
  /v1/experiments/{id}:
    $ref: './paths/v1/experiments/_id.yaml'
  /v1/experiments/{id}/name:
    $ref: './paths/v1/experiments/_id-name.yaml'
  /v1/experiments/{id}/orchestration:
    $ref: './paths/v1/experiments/_id-orchestration.yaml'
  /v1/experiments/{id}/leias:
    $ref: './paths/v1/experiments/_id-leias.yaml'
  /v1/experiments/{id}/leias/{leiaId}:
    $ref: './paths/v1/experiments/_id-leias-_leiaId.yaml'
  /v1/experiments/{id}/publish:
    $ref: './paths/v1/experiments/_id-publish.yaml'

  # Label v1 paths
  /v1/labels:
    $ref: './paths/v1/labels/index.yaml'
  /v1/labels/{id}:
    $ref: './paths/v1/labels/_id.yaml'
  /v1/labels/{sourceLabelId}/merge-into/{targetLabelId}:
    $ref: './paths/v1/labels/merge-_labels.yaml'

  # Rubric v1 paths
  /v1/rubrics:
    $ref: './paths/v1/rubrics/index.yaml'
  /v1/rubrics/schema:
    $ref: './paths/v1/rubrics/schema.yaml'
  /v1/rubrics/{id}:
    $ref: './paths/v1/rubrics/_id.yaml'

  # Runner v1 paths
  /v1/runner/initialize:
    $ref: './paths/v1/runner/initialize.yaml'
  /v1/runner/{sessionId}/messages:
    $ref: './paths/v1/runner/_sessionId-messages.yaml'
  /v1/runner/{sessionId}/evaluate:
    $ref: './paths/v1/runner/_sessionId-evaluate.yaml'
  /v1/runner/transcriptions/generate:
    $ref: './paths/v1/runner/transcriptions-generate.yaml'
  /v1/runner/problems/generate:
    $ref: './paths/v1/runner/problems-generate.yaml'
  /v1/runner/behaviours/generate:
    $ref: './paths/v1/runner/behaviours-generate.yaml'
  /v1/runner/problem-chat/session:
    $ref: './paths/v1/runner/problem-chat-session.yaml'
  /v1/runner/problem-chat/{chatId}/files:
    $ref: './paths/v1/runner/problem-chat-_chatId-files.yaml'
  /v1/runner/problem-chat/{chatId}/messages:
    $ref: './paths/v1/runner/problem-chat-_chatId-messages.yaml'

  # Provider v1 paths
  /v1/provider:
    $ref: './paths/v1/provider/index.yaml'
