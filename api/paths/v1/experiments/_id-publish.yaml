patch:
  tags:
    - Experiments v1
  summary: Publish experiment
  description: Only administrators can publish their own activities.
  operationId: publishExperiment
  parameters:
    - in: path
      name: id
      required: true
      description: ID of the Experiment to publish
      schema:
        type: string
  responses:
    '401':
      description: JWT authentication required
    '403':
      description: Administrator role and activity ownership required
    '200':
      description: Successful response with the updated Experiment
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/experiment/experiment.yaml'
