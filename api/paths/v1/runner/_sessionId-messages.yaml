post:
  tags:
    - Runner v1
  summary: Send a message to a runner session
  operationId: sendRunnerMessage
  parameters:
    - in: path
      name: sessionId
      required: true
      schema:
        type: string
        format: uuid
      description: Runner session identifier
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/v1/runner/runnerMessageRequest.yaml'
  responses:
    '200':
      description: Runner response containing a message or tool calls
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/runner/runnerMessageResponse.yaml'
    '400':
      description: Session ID or message payload is missing
