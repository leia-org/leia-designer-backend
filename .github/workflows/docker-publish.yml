name: Build and Push Docker Image

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILD_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}

jobs:
  build-and-push:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.BUILD_BRANCH }}
            type=raw,value=latest,enable=${{ env.BUILD_BRANCH == 'main' && github.event_name != 'pull_request' }}
            type=sha,prefix=${{ env.BUILD_BRANCH }}-,format=long
            type=sha,prefix=,format=long,enable=${{ env.BUILD_BRANCH == 'main' && github.event_name != 'pull_request' }}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.BUILD_BRANCH }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILD_BRANCH }}

      - name: Verify published manifest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Summarize published image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            printf '### Published Docker image\n\n```text\n%s\n```\n\nDigest: `%s`\n' "$IMAGE_TAGS" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
